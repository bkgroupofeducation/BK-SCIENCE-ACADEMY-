name: Continuous Deployment

# Trigger deployment with updated secrets
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Compress Frontend dist
        run: |
          cd frontend
          tar -czf dist.tar.gz dist

      - name: Copy pre-built frontend archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/dist.tar.gz"
          target: "/var/www/bkscience.in"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== Executing Targeted Science Academy Deployment ==="

            # Explicitly point to the verified science folder path
            APP_PATH="/var/www/bkscience.in"
            cd $APP_PATH || { echo "❌ Directory $APP_PATH not found!"; exit 1; }

            echo "📥 Fetching repository and resetting to origin/main..."
            git fetch --all
            git reset --hard origin/main || { echo "❌ Git pull failed!"; exit 1; }

            echo "📦 Extracting Pre-built Frontend Archive..."
            # Adjust the file placement from the scp action transfer layer
            mv $APP_PATH/frontend/dist.tar.gz $APP_PATH/frontend/dist.tar.gz 2>/dev/null || mv $APP_PATH/dist.tar.gz $APP_PATH/frontend/dist.tar.gz || true
            cd "$APP_PATH/frontend"
            rm -rf dist
            tar -xzf dist.tar.gz
            rm -f dist.tar.gz

            echo "⚙️ Installing Backend Dependencies..."
            cd "$APP_PATH/backend" || { echo "❌ Backend folder not found!"; exit 1; }
            npm install --legacy-peer-deps || { echo "❌ Backend npm install failed!"; exit 1; }

            echo "🚀 Managing Isolated PM2 Process..."
            # Use unique names to avoid cross-project namespace collisions
            if pm2 describe bkscience-backend > /dev/null 2>&1; then
              echo "🔄 PM2 process 'bkscience-backend' found, restarting safely..."
              pm2 restart bkscience-backend --update-env || { echo "❌ PM2 restart failed!"; exit 1; }
            else
              echo "🚀 PM2 process 'bkscience-backend' not found, starting fresh..."
              pm2 start server.js --name "bkscience-backend" --update-env || { echo "❌ PM2 start failed!"; exit 1; }
            fi

            # Clean up the accidental, problematic generic backend process if it is running here
            pm2 delete backend || true
            pm2 save --force

            echo "🌐 Restarting Nginx Web Server..."
            sudo systemctl restart nginx || { echo "❌ Nginx restart failed!"; exit 1; }

            echo "✅ Deployment Completed Successfully without UPSC collisions!"
