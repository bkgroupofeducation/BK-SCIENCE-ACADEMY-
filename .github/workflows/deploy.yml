name: Continuous Deployment

# Trigger deployment with updated secrets
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Compress Frontend dist
        run: |
          cd frontend
          tar -czf dist.tar.gz dist

      - name: Copy pre-built frontend archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/dist.tar.gz"
          target: "/var/www/bkcarreracademy/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== Starting Automated VPS Deployment ==="

            # Define the absolute root path safely
            APP_PATH="/var/www/bkcarreracademy"

            # Navigate to project directory or exit if not found
            cd $APP_PATH || { echo "❌ Directory $APP_PATH not found!"; exit 1; }

            echo "🔍 --- RUNNING SERVER DIAGNOSTICS ---"
            echo "🛡️ checking UFW firewall status..."
            sudo ufw status || echo "ufw not available"

            echo "🌐 checking Nginx status..."
            sudo systemctl status nginx || echo "nginx failed"

            echo "🔌 checking listening ports..."
            sudo ss -tulpn | grep -E "80|443|5007" || echo "no ports listening"

            echo "📥 Fetching and resetting repository to origin/main..."
            git fetch --all
            git reset --hard origin/main || { echo "❌ Git pull failed!"; exit 1; }

            echo "📦 Extracting Pre-built Frontend Archive..."
            mv /var/www/bkcarreracademy/frontend/dist.tar.gz "$APP_PATH/frontend/dist.tar.gz"
            cd "$APP_PATH/frontend"
            rm -rf dist
            tar -xzf dist.tar.gz
            rm -f dist.tar.gz

            echo "⚙️ Installing Backend Dependencies..."
            cd "$APP_PATH/backend" || { echo "❌ Backend folder not found!"; exit 1; }
            npm install --legacy-peer-deps || { echo "❌ Backend npm install failed!"; exit 1; }

            echo "🚀 Managing PM2 Process..."
            if pm2 describe backend > /dev/null 2>&1; then
              echo "🔄 PM2 process 'backend' found, restarting safely..."
              pm2 restart backend --update-env || { echo "❌ PM2 restart failed!"; exit 1; }
            else
              echo "🚀 PM2 process 'backend' not found, starting fresh..."
              pm2 start server.js --name "backend" --update-env || { echo "❌ PM2 start failed!"; exit 1; }
            fi

            pm2 save --force

            echo "🛡️ Ensuring HTTP and HTTPS ports are open in UFW firewall..."
            sudo ufw allow 80/tcp || true
            sudo ufw allow 443/tcp || true
            sudo ufw allow 'Nginx Full' || true
            sudo ufw reload || true

            echo "🌐 Restarting Nginx Web Server..."
            sudo systemctl restart nginx || { echo "❌ Nginx restart failed!"; exit 1; }

            echo "✅ Deployment Completed Successfully!"
